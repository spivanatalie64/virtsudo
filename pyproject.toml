[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtsudo"
version = "1.0.0"
description = "Virtual sudo environment inside a container"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
virtsudo = "virtsudo.cli:main"
